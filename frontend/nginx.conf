server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        proxy_pass http://rh-backend/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://rh-backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /docs/ {
        proxy_pass http://rh-backend/docs/;
        proxy_set_header Host $host;
    }

    # URLs pre-assinadas do MinIO (ver MINIO_PUBLIC_ENDPOINT / utils/storage.py)
    # sao assinadas com este host -- Host precisa bater exatamente com o que
    # foi usado na assinatura (SigV4), por isso $host aqui e nao o nome do
    # servico minio.
    location /files/ {
        proxy_pass http://rh-minio:9000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
